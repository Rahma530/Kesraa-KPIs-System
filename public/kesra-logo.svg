<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="40" fill="#090d16"/>
  <g fill="#ffffff" transform="translate(45, 120)">
    <!-- Arabic "كسرة" Stylized Calligraphy / Typography -->
    <!-- Two dots of the Teh Marbutah / Kaf accent top left -->
    <rect x="52" y="52" width="22" height="22" rx="4" fill="#ffffff" />
    <rect x="80" y="52" width="22" height="22" rx="4" fill="#ffffff" />
    
    <!-- Main Arabic Glyph Body: Kaf, Seen, Reh, Teh Marbouta -->
    <path d="M 40 100 L 110 100 Q 120 100 120 110 L 120 150 Q 120 180 150 180 L 350 180 Q 375 180 375 155 L 375 145 Q 375 125 350 125 L 260 125 L 290 90 L 330 90 Q 395 90 395 145 L 395 155 Q 395 210 345 210 L 140 210 Q 85 210 85 155 L 85 130 L 40 130 Z" fill="#ffffff"/>
    
    <!-- Seen / Kaf Teeth & Connections -->
    <rect x="40" y="100" width="30" height="30" rx="3" fill="#ffffff" />
    <path d="M 120 180 L 155 180 L 155 135 Q 155 120 140 120 L 120 120 Z" fill="#ffffff"/>
    <path d="M 180 180 L 215 180 L 215 135 Q 215 120 200 120 L 180 120 Z" fill="#ffffff"/>
    
    <!-- Latin Brand Name "KESRA" -->
    <text x="205" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="14" fill="#ffffff">KESRA</text>
  </g>
</svg>
